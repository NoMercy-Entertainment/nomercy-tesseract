name: Generate training data

# Manual only — run once, commit results, reuse forever.
# Re-run when characters.txt or the generate script changes.
on:
  workflow_dispatch:
    inputs:
      language:
        description: "Single language code (blank = all)"
        required: false
        default: ""
      max_lines:
        description: "Max corpus lines per language"
        required: false
        default: "100000"

jobs:
  generate:
    name: Generate training text
    runs-on: [self-hosted, beast-unit]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3

      - name: Generate training text files
        run: |
          LANG_FLAG=""
          if [ -n "${{ github.event.inputs.language }}" ]; then
            LANG_FLAG="--lang ${{ github.event.inputs.language }}"
          fi
          python3 training/scripts/generate_training_data.py \
            $LANG_FLAG \
            --max-lines "${{ github.event.inputs.max_lines || '10000' }}"

      - name: Report
        run: |
          echo "## Generated Training Data" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language | Lines | Fonts |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|-------|" >> $GITHUB_STEP_SUMMARY
          total=0
          for dir in training/generated/*/; do
            [ -d "$dir" ] || continue
            lang=$(basename "$dir")
            lines=0
            fonts=0
            if [ -f "$dir/${lang}.training_text" ]; then
              lines=$(wc -l < "$dir/${lang}.training_text")
            fi
            if [ -f "$dir/${lang}.fonts" ]; then
              fonts=$(wc -l < "$dir/${lang}.fonts")
            fi
            echo "| $lang | $lines | $fonts |" >> $GITHUB_STEP_SUMMARY
            total=$((total + lines))
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $total training lines**" >> $GITHUB_STEP_SUMMARY

      - name: Commit training data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add training/generated/ training/held-out/
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore: regenerate training text data [skip ci]"
          git push origin master
