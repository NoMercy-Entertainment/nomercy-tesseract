name: Generate training images

# Manual only — run once, commit results, reuse forever.
# Re-run when characters.txt, fonts, or the generate script changes.
on:
  workflow_dispatch:
    inputs:
      language:
        description: "Single language code (blank = all)"
        required: false
        default: ""

jobs:
  generate:
    name: Generate training images
    runs-on: [self-hosted, beast-unit]

    steps:
      - uses: actions/checkout@v4

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pil \
            fonts-dejavu \
            fonts-liberation \
            fonts-freefont-ttf \
            fonts-noto \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            fonts-noto-extra \
            fonts-noto-ui-core \
            fonts-noto-core

      - name: Generate images
        run: |
          if [ -n "${{ github.event.inputs.language }}" ]; then
            python3 training/scripts/generate-training-data.py --lang "${{ github.event.inputs.language }}"
          else
            python3 training/scripts/generate-training-data.py
          fi

      - name: Report
        run: |
          echo "## Generated Training Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language | Images |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          total=0
          for dir in training/generated/*/; do
            lang=$(basename "$dir")
            count=$(ls "$dir"/*.png 2>/dev/null | wc -l)
            echo "| $lang | $count |" >> $GITHUB_STEP_SUMMARY
            total=$((total + count))
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $total images**" >> $GITHUB_STEP_SUMMARY

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add training/generated/
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore: regenerate training images [skip ci]"
          git push origin master
