name: Fine-tune Tesseract models

on:
  push:
    branches:
      - master
    paths:
      - "training/generated/**"
      - "training/ground-truth/**"
      - "training/config/**"
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated language codes (blank = all)"
        required: false
        default: ""
      max_iterations:
        description: "tesstrain MAX_ITERATIONS"
        required: false
        default: "400"

concurrency:
  group: tesseract-train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Resolve language matrix
    runs-on: [self-hosted, beast-unit]
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Build language matrix
        id: matrix
        shell: python3 {0}
        run: |
          import json, os
          from pathlib import Path

          override = "${{ github.event.inputs.languages }}".strip()

          if override:
              langs = [l.strip() for l in override.split(",") if l.strip()]
          else:
              # Derive from tessdata/ — every .traineddata gets trained
              skip = {"osd", "equ"}
              langs = sorted(
                  p.stem for p in Path("tessdata").glob("*.traineddata")
                  if p.stem not in skip
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"value={json.dumps({'lang': langs})}\n")
          print(f"Languages ({len(langs)}): {langs}")

  train:
    name: Train [${{ matrix.lang }}]
    needs: setup
    runs-on: [self-hosted, beast-unit]

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      LANG_CODE:      ${{ matrix.lang }}
      MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || '400' }}
      WORK_DIR:       /tmp/tess-train/${{ matrix.lang }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract 5 and training tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            libtesseract-dev \
            fonts-noto \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            fonts-noto-extra \
            fonts-noto-ui-core \
            fonts-noto-core \
            fonts-dejavu \
            fonts-liberation

      - name: Verify Tesseract 5
        run: tesseract --version

      - name: Clone tesstrain
        run: git clone --depth 1 https://github.com/tesseract-ocr/tesstrain.git /tmp/tesstrain

      - name: Prepare tesstrain data directory
        run: |
          MODEL="$LANG_CODE"
          DATA_DIR="/tmp/tesstrain/data/$MODEL"
          GT_DIR="/tmp/tesstrain/data/${MODEL}-ground-truth"
          mkdir -p "$DATA_DIR" "$GT_DIR"

          # Copy training text generated by generate.yml
          if [ -f "training/generated/$MODEL/$MODEL.training_text" ]; then
            cp "training/generated/$MODEL/$MODEL.training_text" "$DATA_DIR/"
          else
            echo "WARNING: No training text for $MODEL — will use ground-truth only"
          fi

          # Copy ground-truth images (hand-verified)
          for png in training/ground-truth/${MODEL}_*.png; do
            [ -f "$png" ] || continue
            stem=$(basename "${png%.png}")
            cp "$png" "$GT_DIR/${stem}.png"
            gt="${png%.png}.gt.txt"
            [ -f "$gt" ] && cp "$gt" "$GT_DIR/${stem}.gt.txt"
          done

          # Read font list
          FONTLIST=""
          if [ -f "training/generated/$MODEL/$MODEL.fonts" ]; then
            while IFS= read -r font; do
              [ -n "$font" ] && FONTLIST="${FONTLIST:+$FONTLIST }$font"
            done < "training/generated/$MODEL/$MODEL.fonts"
          fi

          # Fallback font list if none specified
          [ -z "$FONTLIST" ] && FONTLIST="Noto Sans DejaVu Sans"

          echo "FONTLIST=$FONTLIST" >> $GITHUB_ENV
          echo "MODEL=$MODEL" >> $GITHUB_ENV
          echo "DATA_DIR=$DATA_DIR" >> $GITHUB_ENV
          echo "GT_DIR=$GT_DIR" >> $GITHUB_ENV

      - name: Copy tessdata as base for tesstrain
        run: |
          mkdir -p /tmp/tesstrain/usr/share/tessdata
          cp "tessdata/$MODEL.traineddata" /tmp/tesstrain/usr/share/tessdata/

      - name: Run tesstrain
        run: |
          HAS_TEXT=false
          HAS_GT=false
          [ -f "$DATA_DIR/$MODEL.training_text" ] && HAS_TEXT=true
          [ "$(ls -A "$GT_DIR" 2>/dev/null)" ] && HAS_GT=true

          if [ "$HAS_TEXT" = false ] && [ "$HAS_GT" = false ]; then
            echo "ERROR: No training data for $MODEL"
            exit 1
          fi

          make -C /tmp/tesstrain training \
            MODEL_NAME="$MODEL" \
            START_MODEL="$MODEL" \
            TESSDATA=/tmp/tesstrain/usr/share/tessdata \
            MAX_ITERATIONS="$MAX_ITERATIONS" \
            FONTS_DIR=/usr/share/fonts \
            PSM=7 \
          || {
            echo "ERROR: tesstrain make failed for $MODEL"
            exit 1
          }

      - name: Copy trained model to tessdata
        run: cp "/tmp/tesstrain/data/$MODEL.traineddata" "tessdata/$LANG_CODE.traineddata"

      - name: Validate model
        run: |
          python3 training/scripts/validate-model.py \
            --tessdata tessdata/ \
            --lang "$LANG_CODE" \
            --gt-dir training/ground-truth \
            --report "$WORK_DIR/report.json"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.lang }}
          path: ${{ env.WORK_DIR }}/report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated tessdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "tessdata/$LANG_CODE.traineddata"
          git diff --cached --quiet && exit 0

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master || true
            git diff --cached --quiet || git commit -m "chore(tessdata): fine-tune $LANG_CODE [skip ci]"
            if git push origin master; then
              echo "Pushed $LANG_CODE (attempt $attempt)"
              break
            fi
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 2))
          done

      - name: Upload tessdata artifact
        uses: actions/upload-artifact@v4
        with:
          name: tessdata-${{ matrix.lang }}
          path: tessdata/${{ matrix.lang }}.traineddata
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/tesstrain /tmp/tess-train

  report:
    name: Training report
    needs: [setup, train]
    if: always()
    runs-on: [self-hosted, beast-unit]

    steps:
      - uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports/
          merge-multiple: false

      - name: Generate summary
        shell: python3 {0}
        run: |
          import json, os, glob

          reports = []
          for f in sorted(glob.glob("reports/report-*/report.json")):
              try:
                  reports.append(json.load(open(f)))
              except Exception:
                  continue

          summary = "## Tesseract Training Report\n\n"
          summary += "| Language | Status | Passed | Total | Accuracy | Failures |\n"
          summary += "|----------|--------|--------|-------|----------|----------|\n"

          total_passed = 0
          total_total = 0
          failed_langs = []

          for r in reports:
              lang = r.get("lang", "?")
              passed = r.get("passed", 0)
              total = r.get("total", 0)
              status = r.get("status", "unknown")
              failures = r.get("failures", [])
              pct = f"{(passed/total*100):.0f}%" if total > 0 else "-"
              fail_summary = f"{len(failures)} failures" if failures else "-"

              icon = "OK" if status == "passed" else "FAIL" if status == "failed" else "WARN"
              summary += f"| {lang} | {icon} {status} | {passed} | {total} | {pct} | {fail_summary} |\n"

              total_passed += passed
              total_total += total
              if status == "failed":
                  failed_langs.append(lang)

          summary += f"\n**Overall: {total_passed}/{total_total} passed**\n"

          if failed_langs:
              summary += f"\n**Failed languages: {', '.join(failed_langs)}**\n"
              summary += "\n### Failure Details\n\n"
              for r in reports:
                  if r.get("status") != "failed":
                      continue
                  for f in r.get("failures", []):
                      summary += f"- **{r['lang']}**: expected `{f.get('expected')}` got `{f.get('actual')}` ({f.get('accuracy', '?')})\n"

          if not reports:
              summary += "\nNo reports collected — all training jobs may have failed before validation.\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(summary)

          result = {
              "total_passed": total_passed,
              "total_total": total_total,
              "failed_languages": failed_langs,
              "reports": reports,
          }
          with open("training-report.json", "w") as fh:
              json.dump(result, fh, indent=2)

          print(summary)

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: training-report.json
          retention-days: 90
