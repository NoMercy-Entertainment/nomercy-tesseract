name: Fine-tune Tesseract models

on:
  push:
    branches:
      - master
    paths:
      - "training/generated/**"
      - "training/ground-truth/**"
      - "training/config/**"
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated language codes (blank = all)"
        required: false
        default: ""
      max_iterations:
        description: "tesstrain MAX_ITERATIONS"
        required: false
        default: "400"

concurrency:
  group: tesseract-train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Resolve language matrix
    runs-on: [self-hosted, beast-unit]
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Build language matrix
        id: matrix
        shell: python3 {0}
        run: |
          import json, os
          from pathlib import Path

          override = "${{ github.event.inputs.languages }}".strip()

          if override:
              langs = [l.strip() for l in override.split(",") if l.strip()]
          else:
              # Derive from tessdata/ — every .traineddata gets trained
              skip = {"osd", "equ"}
              langs = sorted(
                  p.stem for p in Path("tessdata").glob("*.traineddata")
                  if p.stem not in skip
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"value={json.dumps({'lang': langs})}\n")
          print(f"Languages ({len(langs)}): {langs}")

  train:
    name: Train [${{ matrix.lang }}]
    needs: setup
    runs-on: [self-hosted, beast-unit]

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      LANG_CODE:      ${{ matrix.lang }}
      MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || '400' }}
      WORK_DIR:       /tmp/tess-train/${{ matrix.lang }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract 5 and training tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            libtesseract-dev \
            fonts-noto \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            fonts-noto-extra \
            fonts-noto-ui-core \
            fonts-noto-core \
            fonts-dejavu \
            fonts-liberation

      - name: Verify Tesseract 5
        run: tesseract --version

      - name: Clone tesstrain
        run: git clone --depth 1 https://github.com/tesseract-ocr/tesstrain.git /tmp/tesstrain

      - name: Generate ground-truth with text2image
        run: |
          MODEL="$LANG_CODE"
          GT_DIR="/tmp/tesstrain/data/${MODEL}-ground-truth"
          mkdir -p "$GT_DIR"

          # Read font list
          FONTLIST=""
          if [ -f "training/generated/$MODEL/$MODEL.fonts" ]; then
            while IFS= read -r font; do
              [ -n "$font" ] && FONTLIST="${FONTLIST:+$FONTLIST,}$font"
            done < "training/generated/$MODEL/$MODEL.fonts"
          fi
          [ -z "$FONTLIST" ] && FONTLIST="Noto Sans,DejaVu Sans"

          # Generate .tif + .gt.txt pairs from training text using text2image
          TRAINING_TEXT="training/generated/$MODEL/$MODEL.training_text"
          if [ ! -f "$TRAINING_TEXT" ]; then
            echo "ERROR: No training text for $MODEL at $TRAINING_TEXT"
            exit 1
          fi

          COUNT=0
          FAIL=0
          IFS=$'\n'
          while read -r line; do
            [ -z "$line" ] && continue
            STEM=$(printf "%s_%06d" "$MODEL" "$COUNT")
            OUTBASE="$GT_DIR/$STEM"

            # Try each font until one succeeds
            RENDERED=false
            OLDIFS="$IFS"
            IFS=','
            for font in $FONTLIST; do
              IFS="$OLDIFS"
              if text2image \
                --text <(echo "$line") \
                --outputbase "$OUTBASE" \
                --font "$font" \
                --fonts_dir /usr/share/fonts \
                --ptsize 32 \
                --xsize 3600 \
                --ysize 480 \
                --margin 10 \
                --leading 32 2>/dev/null; then
                # text2image creates .tif — tesstrain expects .tif + .gt.txt
                echo -n "$line" > "${OUTBASE}.gt.txt"
                RENDERED=true
                break
              fi
              IFS=','
            done
            IFS=$'\n'

            if [ "$RENDERED" = false ]; then
              FAIL=$((FAIL + 1))
            else
              COUNT=$((COUNT + 1))
            fi
          done < "$TRAINING_TEXT"

          echo "Generated $COUNT ground-truth pairs ($FAIL failed) for $MODEL"
          [ "$COUNT" -gt 0 ] || { echo "ERROR: no images generated for $MODEL"; exit 1; }

          # Also copy hand-verified ground-truth images
          for png in training/ground-truth/${MODEL}_*.png; do
            [ -f "$png" ] || continue
            stem=$(basename "${png%.png}")
            cp "$png" "$GT_DIR/${stem}.png"
            gt="${png%.png}.gt.txt"
            [ -f "$gt" ] && cp "$gt" "$GT_DIR/${stem}.gt.txt"
          done

          echo "MODEL=$MODEL" >> $GITHUB_ENV
          echo "GT_DIR=$GT_DIR" >> $GITHUB_ENV

      - name: Download tessdata_best model for fine-tuning
        run: |
          # Our repo has fast/int models which CANNOT be fine-tuned.
          # tessdata_best has float models required for LSTM training.
          mkdir -p /tmp/tesstrain/usr/share/tessdata
          BEST_URL="https://github.com/tesseract-ocr/tessdata_best/raw/main/${MODEL}.traineddata"
          echo "Downloading tessdata_best for $MODEL..."
          wget -q -O "/tmp/tesstrain/usr/share/tessdata/${MODEL}.traineddata" "$BEST_URL" || {
            echo "ERROR: Failed to download tessdata_best for $MODEL from $BEST_URL"
            echo "This language may not exist in tessdata_best — skipping"
            exit 1
          }
          echo "Downloaded $(wc -c < /tmp/tesstrain/usr/share/tessdata/${MODEL}.traineddata) bytes"

      - name: Clean blank renders
        run: |
          echo "Cleaning unrenderable ground-truth entries..."
          CLEANED=0
          for tif in "$GT_DIR"/*.tif; do
            [ -f "$tif" ] || continue
            SIZE=$(wc -c < "$tif")
            if [ "$SIZE" -lt 200 ]; then
              STEM="${tif%.tif}"
              rm -f "$STEM".tif "$STEM".gt.txt "$STEM".box "$STEM".lstmf
              CLEANED=$((CLEANED + 1))
            fi
          done
          echo "Removed $CLEANED blank/unrenderable entries"
          REMAINING=$(ls "$GT_DIR"/*.gt.txt 2>/dev/null | wc -l)
          echo "Remaining ground-truth entries: $REMAINING"
          [ "$REMAINING" -gt 0 ] || { echo "ERROR: no valid ground-truth for $MODEL"; exit 1; }

      - name: Download langdata for tesstrain
        run: |
          # tesstrain needs langdata (unicharsets per script, config files)
          LANGDATA_DIR="/tmp/tesstrain/data/langdata"
          mkdir -p "$LANGDATA_DIR/$MODEL"

          # Download radical-stroke.txt (required by combine_lang_model)
          wget -q -O "$LANGDATA_DIR/radical-stroke.txt" \
            "https://github.com/tesseract-ocr/langdata_lstm/raw/main/radical-stroke.txt" || true

          # Download script unicharsets that tesstrain needs
          for script in Latin Cyrillic Greek Arabic Hebrew Devanagari Bengali Tamil Telugu \
                        Kannada Malayalam Gujarati Gurmukhi Thai Khmer Lao Myanmar Sinhala \
                        Ethiopic Georgian Armenian Han Hiragana Katakana Hangul Bopomofo \
                        Canadian_Aboriginal Cherokee Ogham Oriya Runic Syriac; do
            wget -q -O "$LANGDATA_DIR/${script}.unicharset" \
              "https://github.com/tesseract-ocr/langdata_lstm/raw/main/${script}.unicharset" 2>/dev/null || true
          done

          # Download language-specific config if available
          wget -q -O "$LANGDATA_DIR/$MODEL/$MODEL.config" \
            "https://github.com/tesseract-ocr/langdata_lstm/raw/main/$MODEL/$MODEL.config" 2>/dev/null || true

          # Create empty wordlist/punc/numbers if not present (tesstrain requires them)
          touch "$LANGDATA_DIR/$MODEL/$MODEL.wordlist"
          touch "$LANGDATA_DIR/$MODEL/$MODEL.punc"
          touch "$LANGDATA_DIR/$MODEL/$MODEL.numbers"

          echo "Langdata prepared at $LANGDATA_DIR"
          ls -la "$LANGDATA_DIR/" | head -10

      - name: Run tesstrain
        run: |
          make -k -C /tmp/tesstrain training \
            MODEL_NAME="$MODEL" \
            START_MODEL="$MODEL" \
            TESSDATA=/tmp/tesstrain/usr/share/tessdata \
            LANGDATA_DIR=/tmp/tesstrain/data/langdata \
            MAX_ITERATIONS="$MAX_ITERATIONS" \
            PSM=7 \
          || {
            if [ -f "/tmp/tesstrain/data/$MODEL.traineddata" ]; then
              echo "WARNING: tesstrain had errors but produced $MODEL.traineddata — continuing"
            else
              echo "ERROR: tesstrain failed and did not produce $MODEL.traineddata"
              exit 1
            fi
          }

      - name: Copy trained model to tessdata
        run: cp "/tmp/tesstrain/data/$MODEL.traineddata" "tessdata/$LANG_CODE.traineddata"

      - name: Validate model
        run: |
          python3 training/scripts/validate-model.py \
            --tessdata tessdata/ \
            --lang "$LANG_CODE" \
            --gt-dir training/ground-truth \
            --report "$WORK_DIR/report.json"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.lang }}
          path: ${{ env.WORK_DIR }}/report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated tessdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "tessdata/$LANG_CODE.traineddata"
          git diff --cached --quiet && exit 0

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master || true
            git diff --cached --quiet || git commit -m "chore(tessdata): fine-tune $LANG_CODE [skip ci]"
            if git push origin master; then
              echo "Pushed $LANG_CODE (attempt $attempt)"
              break
            fi
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 2))
          done

      - name: Upload tessdata artifact
        uses: actions/upload-artifact@v4
        with:
          name: tessdata-${{ matrix.lang }}
          path: tessdata/${{ matrix.lang }}.traineddata
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/tesstrain /tmp/tess-train

  report:
    name: Training report
    needs: [setup, train]
    if: always()
    runs-on: [self-hosted, beast-unit]

    steps:
      - uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports/
          merge-multiple: false

      - name: Generate summary
        shell: python3 {0}
        run: |
          import json, os, glob

          reports = []
          for f in sorted(glob.glob("reports/report-*/report.json")):
              try:
                  reports.append(json.load(open(f)))
              except Exception:
                  continue

          summary = "## Tesseract Training Report\n\n"
          summary += "| Language | Status | Passed | Total | Accuracy | Failures |\n"
          summary += "|----------|--------|--------|-------|----------|----------|\n"

          total_passed = 0
          total_total = 0
          failed_langs = []

          for r in reports:
              lang = r.get("lang", "?")
              passed = r.get("passed", 0)
              total = r.get("total", 0)
              status = r.get("status", "unknown")
              failures = r.get("failures", [])
              pct = f"{(passed/total*100):.0f}%" if total > 0 else "-"
              fail_summary = f"{len(failures)} failures" if failures else "-"

              icon = "OK" if status == "passed" else "FAIL" if status == "failed" else "WARN"
              summary += f"| {lang} | {icon} {status} | {passed} | {total} | {pct} | {fail_summary} |\n"

              total_passed += passed
              total_total += total
              if status == "failed":
                  failed_langs.append(lang)

          summary += f"\n**Overall: {total_passed}/{total_total} passed**\n"

          if failed_langs:
              summary += f"\n**Failed languages: {', '.join(failed_langs)}**\n"
              summary += "\n### Failure Details\n\n"
              for r in reports:
                  if r.get("status") != "failed":
                      continue
                  for f in r.get("failures", []):
                      summary += f"- **{r['lang']}**: expected `{f.get('expected')}` got `{f.get('actual')}` ({f.get('accuracy', '?')})\n"

          if not reports:
              summary += "\nNo reports collected — all training jobs may have failed before validation.\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(summary)

          result = {
              "total_passed": total_passed,
              "total_total": total_total,
              "failed_languages": failed_langs,
              "reports": reports,
          }
          with open("training-report.json", "w") as fh:
              json.dump(result, fh, indent=2)

          print(summary)

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: training-report.json
          retention-days: 90
