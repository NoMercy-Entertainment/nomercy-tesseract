name: Fine-tune Tesseract models

on:
  push:
    branches:
      - master
    paths:
      - "training/generated/**"
      - "training/ground-truth/**"
      - "training/config/**"
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated language codes (blank = all)"
        required: false
        default: ""
      max_iterations:
        description: "tesstrain MAX_ITERATIONS"
        required: false
        default: "50000"
      resume_run_id:
        description: "Workflow run ID to resume training checkpoints from (blank = fresh start from stock)"
        required: false
        default: ""

concurrency:
  group: tesseract-train-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve language matrix
    runs-on: [self-hosted, beast-unit]
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Build language matrix
        id: matrix
        shell: python3 {0}
        run: |
          import json, os
          from pathlib import Path

          override = "${{ github.event.inputs.languages }}".strip()

          if override:
              langs = [l.strip() for l in override.split(",") if l.strip()]
          else:
              # Derive from tessdata/ — every .traineddata gets trained
              skip = {"osd", "equ"}
              langs = sorted(
                  p.stem for p in Path("tessdata").glob("*.traineddata")
                  if p.stem not in skip
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"value={json.dumps({'lang': langs})}\n")
          print(f"Languages ({len(langs)}): {langs}")

  train:
    name: Train [${{ matrix.lang }}]
    needs: setup
    runs-on: [self-hosted, beast-unit]

    strategy:
      fail-fast: false
      max-parallel: 2  # beast-unit has 56 cores; 2 parallel jobs = 28 cores each (sane)
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      LANG_CODE:      ${{ matrix.lang }}
      MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || '100000' }}
      WORK_DIR:       /tmp/tess-train/${{ matrix.lang }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make pkg-config \
            libleptonica-dev libicu-dev libpango1.0-dev libcairo2-dev \
            fonts-noto fonts-noto-cjk fonts-noto-cjk-extra \
            fonts-noto-extra fonts-noto-ui-core fonts-noto-core \
            fonts-dejavu fonts-liberation wget

      - name: Build patched Tesseract (--append_index fix)
        run: |
          if [ -x "$HOME/tesseract-install/bin/lstmtraining" ]; then
            echo "Patched Tesseract already built, skipping"
          else
            rm -rf $HOME/tesseract-src
            git clone --depth 1 --branch fix/append-index-lstmrecognizer \
              https://github.com/NoMercy-Entertainment/tesseract.git $HOME/tesseract-src
            cd $HOME/tesseract-src
            mkdir -p build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TRAINING_TOOLS=ON \
              -DCMAKE_INSTALL_PREFIX=$HOME/tesseract-install
            make -j$(nproc)
            sudo make install
            sudo ldconfig
            echo "Build complete"
          fi
          export PATH=$HOME/tesseract-install/bin:$PATH
          export LD_LIBRARY_PATH=$HOME/tesseract-install/lib:$LD_LIBRARY_PATH
          echo "PATH=$HOME/tesseract-install/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/tesseract-install/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "TESSDATA_PREFIX=/tmp/tesstrain-${LANG_CODE}/usr/share/tessdata" >> $GITHUB_ENV
          tesseract --version
          which lstmtraining

      - name: Clone tesstrain
        run: |
          rm -rf /tmp/tesstrain-${LANG_CODE}
          git clone --depth 1 https://github.com/tesseract-ocr/tesstrain.git /tmp/tesstrain-${LANG_CODE}

      - name: Install Pillow
        run: pip3 install --quiet --break-system-packages Pillow

      - name: Generate ground-truth with render_diverse (parallel)
        run: |
          MODEL="$LANG_CODE"
          GT_DIR="/tmp/tesstrain-${LANG_CODE}/data/${MODEL}-ground-truth"
          mkdir -p "$GT_DIR"

          TRAINING_TEXT="training/generated/$MODEL/$MODEL.training_text"
          FONTS_FILE="training/generated/$MODEL/$MODEL.fonts"
          if [ ! -f "$TRAINING_TEXT" ]; then
            echo "ERROR: No training text for $MODEL at $TRAINING_TEXT"
            exit 1
          fi
          if [ ! -f "$FONTS_FILE" ]; then
            echo "DejaVu Sans" > "$FONTS_FILE"
          fi

          TOTAL_LINES=$(wc -l < "$TRAINING_TEXT")
          echo "Rendering $TOTAL_LINES lines with render_diverse.py..."

          python3 training/scripts/render_diverse.py \
            --training-text "$TRAINING_TEXT" \
            --fonts-file "$FONTS_FILE" \
            --out-dir "$GT_DIR" \
            --lang "$MODEL" \
            --max-lines 100000 \
            --workers "$(nproc)"

          COUNT=$(find "$GT_DIR" -maxdepth 1 -name "*.gt.txt" | wc -l)
          echo "Generated $COUNT ground-truth pairs for $MODEL"
          [ "$COUNT" -gt 0 ] || { echo "ERROR: no images generated for $MODEL"; exit 1; }

          # Also copy hand-verified ground-truth images
          for png in training/ground-truth/${MODEL}_*.png; do
            [ -f "$png" ] || continue
            stem=$(basename "${png%.png}")
            cp "$png" "$GT_DIR/${stem}.png"
            gt="${png%.png}.gt.txt"
            [ -f "$gt" ] && cp "$gt" "$GT_DIR/${stem}.gt.txt"
          done

          echo "MODEL=$MODEL" >> $GITHUB_ENV
          echo "GT_DIR=$GT_DIR" >> $GITHUB_ENV

      - name: Download tessdata_best model for fine-tuning
        run: |
          # Our repo has fast/int models which CANNOT be fine-tuned.
          # tessdata_best has float models required for LSTM training.
          mkdir -p /tmp/tesstrain-${LANG_CODE}/usr/share/tessdata
          # Copy tessdata configs (lstm.train etc.) to TESSDATA_PREFIX
          cp -r $HOME/tesseract-install/share/tessdata/configs /tmp/tesstrain-${LANG_CODE}/usr/share/tessdata/ 2>/dev/null || true
          cp -r $HOME/tesseract-install/share/tessdata/tessconfigs /tmp/tesstrain-${LANG_CODE}/usr/share/tessdata/ 2>/dev/null || true
          BEST_URL="https://github.com/tesseract-ocr/tessdata_best/raw/main/${MODEL}.traineddata"
          echo "Downloading tessdata_best for $MODEL..."
          wget -q -O "/tmp/tesstrain-${LANG_CODE}/usr/share/tessdata/${MODEL}.traineddata" "$BEST_URL" || {
            echo "ERROR: Failed to download tessdata_best for $MODEL from $BEST_URL"
            echo "This language may not exist in tessdata_best — skipping"
            exit 1
          }
          echo "Downloaded $(wc -c < /tmp/tesstrain-${LANG_CODE}/usr/share/tessdata/${MODEL}.traineddata) bytes"

      - name: Validate ground-truth pairs
        run: |
          # Generate box files and remove any pair where box generation fails.
          # render_diverse outputs PNG; generate_line_box accepts any image format.
          GT_COUNT=$(find "$GT_DIR" -maxdepth 1 -name "*.gt.txt" | wc -l)
          NCPU=$(nproc)
          echo "Validating $GT_COUNT ground-truth pairs ($NCPU parallel workers)..."

          cd /tmp/tesstrain-${LANG_CODE}

          # Parallel box generation + validation (use find to avoid ARG_MAX)
          find "$GT_DIR" -maxdepth 1 -name "*.gt.txt" -print0 | \
            xargs -0 -P "$NCPU" -I {} bash -c '
            gt="{}"
            STEM="${gt%.gt.txt}"
            IMG=""
            for ext in png tif tiff; do
              if [ -f "${STEM}.${ext}" ] && [ "$(wc -c < "${STEM}.${ext}")" -ge 200 ]; then
                IMG="${STEM}.${ext}"
                break
              fi
            done
            if [ -z "$IMG" ]; then
              rm -f "${STEM}".gt.txt "${STEM}".png "${STEM}".tif "${STEM}".tiff
              exit 0
            fi
            python3 generate_line_box.py -i "$IMG" -t "${STEM}.gt.txt" > "${STEM}.box" 2>/dev/null
            if [ ! -s "${STEM}.box" ]; then
              rm -f "${STEM}".gt.txt "${STEM}".png "${STEM}".tif "${STEM}".tiff "${STEM}".box
            fi
          '

          cd -
          VALID=$(find "$GT_DIR" -maxdepth 1 -name "*.gt.txt" | wc -l)
          REMOVED=$((GT_COUNT - VALID))
          echo "Valid: $VALID, Removed: $REMOVED"
          [ "$VALID" -gt 0 ] || { echo "ERROR: no valid ground-truth for $MODEL"; exit 1; }

      - name: Prepare langdata and output dir for tesstrain
        run: |
          OUTPUT_DIR="/tmp/tesstrain-${LANG_CODE}/data/$MODEL"
          LANGDATA_DIR="/tmp/tesstrain-${LANG_CODE}/data/langdata"
          mkdir -p "$OUTPUT_DIR" "$LANGDATA_DIR/$MODEL"

          # Download radical-stroke.txt (required by combine_lang_model)
          wget -q -O "$LANGDATA_DIR/radical-stroke.txt" \
            "https://github.com/tesseract-ocr/langdata_lstm/raw/main/radical-stroke.txt" || true

          # Download script unicharsets that tesstrain needs
          echo "Downloading script unicharsets..."
          SCRIPTS="Latin Cyrillic Greek Arabic Hebrew Devanagari Bengali Tamil Telugu
                   Kannada Malayalam Gujarati Gurmukhi Thai Khmer Lao Myanmar Sinhala
                   Ethiopic Georgian Armenian Han Hiragana Katakana Hangul Bopomofo
                   Canadian_Aboriginal Cherokee Ogham Oriya Runic Syriac"
          DL_COUNT=0
          for script in $SCRIPTS; do
            wget -q -O "$LANGDATA_DIR/${script}.unicharset" \
              "https://github.com/tesseract-ocr/langdata_lstm/raw/main/${script}.unicharset" 2>/dev/null && DL_COUNT=$((DL_COUNT + 1)) || true
          done
          echo "Downloaded $DL_COUNT script unicharsets"

          # Create wordlist/punc/numbers in OUTPUT_DIR (where Makefile expects them)
          touch "$OUTPUT_DIR/$MODEL.wordlist"
          touch "$OUTPUT_DIR/$MODEL.punc"
          touch "$OUTPUT_DIR/$MODEL.numbers"

          # Download language config to langdata dir
          wget -q -O "$LANGDATA_DIR/$MODEL/$MODEL.config" \
            "https://github.com/tesseract-ocr/langdata_lstm/raw/main/$MODEL/$MODEL.config" 2>/dev/null || true

          echo "Langdata and output dir prepared"

      - name: "Phase 1: Generate lstmf files"
        run: |
          GT_DIR="/tmp/tesstrain-${LANG_CODE}/data/${MODEL}-ground-truth"
          OUTPUT_DIR="/tmp/tesstrain-${LANG_CODE}/data/$MODEL"
          GT_FILES=$(find "$GT_DIR" -maxdepth 1 -name "*.gt.txt" | wc -l)
          echo "Starting: $GT_FILES ground-truth files, $MAX_ITERATIONS iterations"
          echo "  Ultra-gentle fine-tune from stock (no proto model, no unicharset extension)"
          echo ""

          export TESSDATA_PREFIX=/tmp/tesstrain-${LANG_CODE}/usr/share/tessdata
          export LD_LIBRARY_PATH=$HOME/tesseract-install/lib:${LD_LIBRARY_PATH:-}
          export PATH=$HOME/tesseract-install/bin:$PATH
          echo "Using tesseract: $(which tesseract)"

          mkdir -p "$OUTPUT_DIR"

          # Generate lstmf files via xargs (direct tesseract to bypass make ARG_MAX)
          NCPU=$(nproc)
          echo "Generating lstmf files ($NCPU parallel via xargs)..."
          # Sanity check: run tesseract on first sample with stderr visible to
          # surface real errors — silenced loop hid them previously.
          FIRST_GT=$(find "$GT_DIR" -maxdepth 1 -name "*.gt.txt" | head -1)
          if [ -n "$FIRST_GT" ]; then
            FIRST_STEM="${FIRST_GT%.gt.txt}"
            for ext in png tif tiff; do
              [ -f "${FIRST_STEM}.${ext}" ] && FIRST_IMG="${FIRST_STEM}.${ext}" && break
            done
            echo "Sample test: tesseract -l $MODEL $FIRST_IMG"
            tesseract "$FIRST_IMG" "$FIRST_STEM" --psm 13 -l "$MODEL" lstm.train || true
          fi
          find "$GT_DIR" -maxdepth 1 -name "*.gt.txt" -print0 | \
            xargs -0 -P "$NCPU" -I {} bash -c '
              gt="{}"
              STEM="${gt%.gt.txt}"
              IMG=""
              for ext in png tif tiff; do
                [ -f "${STEM}.${ext}" ] && IMG="${STEM}.${ext}" && break
              done
              [ -z "$IMG" ] && exit 0
              [ ! -f "${STEM}.box" ] && exit 0
              tesseract "$IMG" "$STEM" --psm 13 -l "'"$MODEL"'" lstm.train 2>/dev/null || true
            '

          find "$GT_DIR" -maxdepth 1 -name "*.lstmf" > "$OUTPUT_DIR/all-lstmf"
          TOTAL_LSTMF=$(wc -l < "$OUTPUT_DIR/all-lstmf")
          echo "Generated $TOTAL_LSTMF lstmf files"

          cd /tmp/tesstrain-${LANG_CODE}
          python3 shuffle.py 0 "$OUTPUT_DIR/all-lstmf"
          TRAIN_SIZE=$(( TOTAL_LSTMF * 90 / 100 ))
          head -n "$TRAIN_SIZE" "$OUTPUT_DIR/all-lstmf" > "$OUTPUT_DIR/list.train"
          tail -n +"$((TRAIN_SIZE + 1))" "$OUTPUT_DIR/all-lstmf" > "$OUTPUT_DIR/list.eval"
          cd -

          TRAIN_COUNT=$(wc -l < "$OUTPUT_DIR/list.train")
          EVAL_COUNT=$(wc -l < "$OUTPUT_DIR/list.eval")
          echo "Training: $TRAIN_COUNT, Eval: $EVAL_COUNT"
          [ "$TRAIN_COUNT" -gt 0 ] || { echo "ERROR: no training files"; exit 1; }

          # Reclaim disk: PNG/box files no longer needed once .lstmf are written.
          # Beast-unit hits "no space left on device" when 2 parallel jobs each
          # leave ~3-5GB of GT renders sitting around through Phase 2 training.
          echo "Pre-training disk free:"
          df -h /tmp | tail -1
          find "$GT_DIR" -maxdepth 1 \( -name "*.png" -o -name "*.tif" -o -name "*.tiff" -o -name "*.box" -o -name "*.gt.txt" \) -delete 2>/dev/null || true
          echo "Post-cleanup disk free:"
          df -h /tmp | tail -1

      - name: Restore checkpoints from prior run (if resuming)
        if: github.event.inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: checkpoints-${{ matrix.lang }}
          path: /tmp/tesstrain-${{ matrix.lang }}/data/${{ matrix.lang }}/checkpoints/
          run-id: ${{ github.event.inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: "Phase 2: Ultra-gentle fine-tune from stock LSTM"
        run: |
          OUTPUT_DIR="/tmp/tesstrain-${LANG_CODE}/data/$MODEL"
          TESSDATA_DIR="/tmp/tesstrain-${LANG_CODE}/usr/share/tessdata"

          mkdir -p "$OUTPUT_DIR/checkpoints"

          # Determine continue_from source: resumed checkpoint takes priority over stock
          RESUME_CKPT=$(ls -t "$OUTPUT_DIR"/checkpoints/${MODEL}_checkpoint 2>/dev/null | head -1)
          if [ -n "$RESUME_CKPT" ] && [ -s "$RESUME_CKPT" ]; then
            echo "RESUMING from prior checkpoint: $RESUME_CKPT ($(wc -c < "$RESUME_CKPT") bytes)"
            CONTINUE_FROM="$RESUME_CKPT"
          else
            echo "Fresh start — extracting stock LSTM for --continue_from"
            combine_tessdata -e "$TESSDATA_DIR/$MODEL.traineddata" "$OUTPUT_DIR/${MODEL}.lstm"
            [ -s "$OUTPUT_DIR/${MODEL}.lstm" ] || { echo "ERROR: failed to extract stock LSTM"; exit 1; }
            echo "Extracted stock LSTM: $(wc -c < "$OUTPUT_DIR/${MODEL}.lstm") bytes"
            CONTINUE_FROM="$OUTPUT_DIR/$MODEL.lstm"
          fi

          echo "Ultra-gentle fine-tune from stock..."
          echo "  Continue from: $CONTINUE_FROM"
          echo "  LR 0.00001 (100x lower than standard fine-tune)"
          echo "  Iter: $MAX_ITERATIONS"
          echo ""

          set +e
          lstmtraining \
            --traineddata "$TESSDATA_DIR/$MODEL.traineddata" \
            --continue_from "$CONTINUE_FROM" \
            --learning_rate 0.00001 \
            --model_output "$OUTPUT_DIR/checkpoints/$MODEL" \
            --train_listfile "$OUTPUT_DIR/list.train" \
            --eval_listfile "$OUTPUT_DIR/list.eval" \
            --max_iterations "$MAX_ITERATIONS" \
            --target_error_rate 0.005 \
            --debug_interval 0
          rc=$?
          set -e
          echo "lstmtraining exit rc=$rc"
          if [ "$rc" -ne 0 ]; then
            # lstmtraining writes {model_output}_checkpoint and optionally
            # {model_output}_{bcer}_{iter}_{iter}.checkpoint. Match both.
            CKPT_COUNT=$(find "$OUTPUT_DIR/checkpoints" -maxdepth 1 \( -name "*checkpoint" -o -name "*.checkpoint" \) 2>/dev/null | wc -l)
            echo "Checkpoint count: $CKPT_COUNT"
            ls -la "$OUTPUT_DIR/checkpoints/" 2>/dev/null | head -20 || true
            if [ "$CKPT_COUNT" -gt 0 ]; then
              echo "Tolerating exit $rc — $CKPT_COUNT checkpoints present"
            else
              echo "No checkpoints — training genuinely failed"
              exit $rc
            fi
          fi

      - name: Upload training checkpoints (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoints-${{ matrix.lang }}
          path: /tmp/tesstrain-${{ matrix.lang }}/data/${{ matrix.lang }}/checkpoints/
          if-no-files-found: warn
          retention-days: 30

      - name: "Phase 3: Package traineddata"
        run: |
          OUTPUT_DIR="/tmp/tesstrain-${LANG_CODE}/data/$MODEL"
          TESSDATA_DIR="/tmp/tesstrain-${LANG_CODE}/usr/share/tessdata"
          CHECKPOINT=$(ls -t "$OUTPUT_DIR"/checkpoints/${MODEL}*checkpoint 2>/dev/null | head -1)
          [ -n "$CHECKPOINT" ] || { echo "ERROR: no checkpoint found"; exit 1; }
          echo "Using checkpoint: $CHECKPOINT"

          lstmtraining \
            --stop_training \
            --continue_from "$CHECKPOINT" \
            --traineddata "$TESSDATA_DIR/$MODEL.traineddata" \
            --model_output "tessdata/$LANG_CODE.traineddata"

          SIZE=$(wc -c < "tessdata/$LANG_CODE.traineddata")
          echo "Output: tessdata/$LANG_CODE.traineddata ($SIZE bytes)"

      - name: Run benchmark on fine-tuned model
        id: bench
        continue-on-error: true
        run: |
          HELD_OUT=training/held-out/${LANG_CODE}.txt
          if [ ! -f "$HELD_OUT" ]; then
            echo "held_out_missing=true" >> $GITHUB_OUTPUT
            echo "WARNING: $HELD_OUT missing — skipping validation gate"
            exit 0
          fi
          mkdir -p "$WORK_DIR"
          python3 training/scripts/benchmark.py \
            --lang "$LANG_CODE" \
            --tessdata tessdata/ \
            --held-out "$HELD_OUT" \
            --render-dir "/tmp/bench_${LANG_CODE}" \
            --model-tag "current" \
            --output "$WORK_DIR/new_bench.json" \
            --max-lines 200

      - name: Gate on 40% BCER reduction
        id: gate
        env:
          NEW_JSON: ${{ env.WORK_DIR }}/new_bench.json
          BASELINE: training/benchmark/baseline.json
        run: |
          if [ "${{ steps.bench.outputs.held_out_missing }}" = "true" ]; then
            echo "No held-out data — commit allowed as unvalidated"
            echo "should_commit=true" >> $GITHUB_OUTPUT
            echo "tag=unvalidated" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -f "$NEW_JSON" ]; then
            echo "Benchmark script failed — refusing commit"
            echo "should_commit=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [ ! -f "$BASELINE" ]; then
            echo "No baseline.json — commit allowed as first-run"
            echo "should_commit=true" >> $GITHUB_OUTPUT
            echo "tag=first-run" >> $GITHUB_OUTPUT
            exit 0
          fi

          python3 - <<PYEOF
          import json, os, sys
          new = json.load(open(os.environ["NEW_JSON"]))
          baseline_all = json.load(open(os.environ["BASELINE"]))
          lang = "${{ matrix.lang }}"
          base = baseline_all.get(lang)
          if base is None:
              print(f"No baseline entry for {lang} — allowing commit")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("should_commit=true\n")
                  fh.write("tag=no-baseline\n")
              sys.exit(0)
          new_bcer  = new["bcer"]
          base_bcer = base["bcer"]
          reduction = (base_bcer - new_bcer) / base_bcer if base_bcer > 0 else 0.0
          print(f"Baseline BCER: {base_bcer:.4f}")
          print(f"New BCER:      {new_bcer:.4f}")
          print(f"Reduction:     {reduction:.1%}  (target: >=40%)")
          passed = reduction >= 0.40
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"should_commit={'true' if passed else 'false'}\n")
              fh.write(f"reduction={reduction:.4f}\n")
              fh.write(f"new_bcer={new_bcer:.4f}\n")
              fh.write(f"baseline_bcer={base_bcer:.4f}\n")
              fh.write(f"tag={'pass' if passed else 'fail'}\n")
          PYEOF

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.lang }}
          path: ${{ env.WORK_DIR }}/new_bench.json
          if-no-files-found: ignore

      - name: Commit updated tessdata (gated)
        if: steps.gate.outputs.should_commit == 'true'
        run: |
          TAG="${{ steps.gate.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "tessdata/$LANG_CODE.traineddata"
          git diff --cached --quiet && exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master || true
            git diff --cached --quiet || git commit -m "chore(tessdata): fine-tune $LANG_CODE ($TAG) [skip ci]"
            if git push origin master; then
              echo "Pushed $LANG_CODE (attempt $attempt)"
              break
            fi
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 2))
          done

      - name: Rejected — keep existing tessdata
        if: steps.gate.outputs.should_commit != 'true'
        run: |
          REDUCTION="${{ steps.gate.outputs.reduction }}"
          NEW="${{ steps.gate.outputs.new_bcer }}"
          BASE="${{ steps.gate.outputs.baseline_bcer }}"
          echo "::warning::Validation gate REJECTED $LANG_CODE"
          echo "  Baseline BCER: $BASE"
          echo "  New BCER:      $NEW"
          echo "  Reduction:     $REDUCTION (target >= 0.4)"
          echo "  Existing tessdata preserved — new model discarded."
          git checkout -- "tessdata/$LANG_CODE.traineddata" || true

      - name: Upload tessdata artifact
        uses: actions/upload-artifact@v4
        with:
          name: tessdata-${{ matrix.lang }}
          path: tessdata/${{ matrix.lang }}.traineddata
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/tesstrain-${LANG_CODE} /tmp/tess-train

  report:
    name: Training report
    needs: [setup, train]
    if: always()
    runs-on: [self-hosted, beast-unit]

    steps:
      - uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports/
          merge-multiple: false

      - name: Generate summary
        shell: python3 {0}
        run: |
          import json, os, glob

          reports = []
          for f in sorted(glob.glob("reports/report-*/report.json")):
              try:
                  reports.append(json.load(open(f)))
              except Exception:
                  continue

          summary = "## Tesseract Training Report\n\n"
          summary += "| Language | Status | Passed | Total | Accuracy | Failures |\n"
          summary += "|----------|--------|--------|-------|----------|----------|\n"

          total_passed = 0
          total_total = 0
          failed_langs = []

          for r in reports:
              lang = r.get("lang", "?")
              passed = r.get("passed", 0)
              total = r.get("total", 0)
              status = r.get("status", "unknown")
              failures = r.get("failures", [])
              pct = f"{(passed/total*100):.0f}%" if total > 0 else "-"
              fail_summary = f"{len(failures)} failures" if failures else "-"

              icon = "OK" if status == "passed" else "FAIL" if status == "failed" else "WARN"
              summary += f"| {lang} | {icon} {status} | {passed} | {total} | {pct} | {fail_summary} |\n"

              total_passed += passed
              total_total += total
              if status == "failed":
                  failed_langs.append(lang)

          summary += f"\n**Overall: {total_passed}/{total_total} passed**\n"

          if failed_langs:
              summary += f"\n**Failed languages: {', '.join(failed_langs)}**\n"
              summary += "\n### Failure Details\n\n"
              for r in reports:
                  if r.get("status") != "failed":
                      continue
                  for f in r.get("failures", []):
                      summary += f"- **{r['lang']}**: expected `{f.get('expected')}` got `{f.get('actual')}` ({f.get('accuracy', '?')})\n"

          if not reports:
              summary += "\nNo reports collected — all training jobs may have failed before validation.\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(summary)

          result = {
              "total_passed": total_passed,
              "total_total": total_total,
              "failed_languages": failed_langs,
              "reports": reports,
          }
          with open("training-report.json", "w") as fh:
              json.dump(result, fh, indent=2)

          print(summary)

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: training-report.json
          retention-days: 90
