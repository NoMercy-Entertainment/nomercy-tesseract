name: Fine-tune Tesseract models

on:
  push:
    branches:
      - master
    paths:
      - "training/generated/**"
      - "training/ground-truth/**"
      - "training/config/**"
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated language codes (blank = all)"
        required: false
        default: ""
      max_iterations:
        description: "lstmtraining max iterations"
        required: false
        default: "400"

concurrency:
  group: tesseract-train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Resolve language matrix
    runs-on: [self-hosted, beast-unit]
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Build language matrix
        id: matrix
        shell: python3 {0}
        run: |
          import json, os

          override = "${{ github.event.inputs.languages }}".strip()

          if override:
              langs = [l.strip() for l in override.split(",") if l.strip()]
          else:
              raw = open("training/config/languages.txt", encoding="utf-8").readlines()
              langs = [l.strip() for l in raw if l.strip() and not l.strip().startswith("#")]

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"value={json.dumps({'lang': langs})}\n")
          print(f"Languages: {langs}")

  train:
    name: Train [${{ matrix.lang }}]
    needs: setup
    runs-on: [self-hosted, beast-unit]

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      LANG_CODE:      ${{ matrix.lang }}
      MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || '400' }}
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      WORK_DIR:       /tmp/tess-train/${{ matrix.lang }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract 5 and training tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-$LANG_CODE \
            libtesseract-dev \
            python3-pil

      - name: Verify Tesseract 5
        run: tesseract --version 2>&1 | grep -qE "^tesseract 5\." || exit 1

      - name: Prepare working directory
        run: mkdir -p "$WORK_DIR/lstmf" "$WORK_DIR/output"

      - name: Extract base LSTM model
        run: |
          cp "$TESSDATA_PREFIX/${LANG_CODE}.traineddata" "$WORK_DIR/"
          combine_tessdata -e "$WORK_DIR/${LANG_CODE}.traineddata" "$WORK_DIR/${LANG_CODE}.lstm"

      - name: Collect training images
        run: |
          DEST="$WORK_DIR/images"
          mkdir -p "$DEST"

          # Pre-generated synthetic images (committed to repo)
          if [ -d "training/generated/$LANG_CODE" ]; then
            cp training/generated/$LANG_CODE/*.png "$DEST/" 2>/dev/null || true
            cp training/generated/$LANG_CODE/*.gt.txt "$DEST/" 2>/dev/null || true
          fi

          # Manual ground-truth corrections
          for png in training/ground-truth/${LANG_CODE}_*.png; do
            [ -f "$png" ] || continue
            cp "$png" "${png%.png}.gt.txt" "$DEST/" 2>/dev/null || true
          done

          count=$(ls "$DEST"/*.png 2>/dev/null | wc -l)
          echo "Training images for $LANG_CODE: $count"
          [ "$count" -gt 0 ] || { echo "ERROR: no training images found"; exit 1; }

      - name: Generate .lstmf files
        run: |
          cd "$WORK_DIR/images"
          TRAIN_LIST="$WORK_DIR/train_list.txt"
          > "$TRAIN_LIST"

          for png in *.png; do
            stem="${png%.png}"
            [ -f "${stem}.gt.txt" ] || continue
            tesseract "$png" "$stem" --psm 7 --tessdata-dir "$TESSDATA_PREFIX" -l "$LANG_CODE" lstm.train 2>/dev/null || continue
            echo "$WORK_DIR/images/${stem}.lstmf" >> "$TRAIN_LIST"
          done

          total=$(wc -l < "$TRAIN_LIST")
          echo "Generated $total .lstmf files"
          [ "$total" -gt 0 ] || { echo "ERROR: no .lstmf files generated"; exit 1; }

      - name: Fine-tune LSTM model
        run: |
          lstmtraining \
            --continue_from "$WORK_DIR/${LANG_CODE}.lstm" \
            --model_output "$WORK_DIR/output/${LANG_CODE}" \
            --traineddata "$WORK_DIR/${LANG_CODE}.traineddata" \
            --train_listfile "$WORK_DIR/train_list.txt" \
            --max_iterations "$MAX_ITERATIONS"

      - name: Package traineddata
        run: |
          CHECKPOINT="$WORK_DIR/output/${LANG_CODE}_checkpoint"
          [ -f "$CHECKPOINT" ] || { echo "ERROR: no checkpoint"; exit 1; }

          lstmtraining \
            --stop_training \
            --continue_from "$CHECKPOINT" \
            --traineddata "$WORK_DIR/${LANG_CODE}.traineddata" \
            --model_output "tessdata/${LANG_CODE}.traineddata"

      - name: Validate model
        run: |
          python3 training/scripts/validate-model.py \
            --tessdata tessdata/ \
            --lang "$LANG_CODE" \
            --gt-dir training/ground-truth

      - name: Commit updated tessdata
        uses: EndBug/add-and-commit@v9
        with:
          add: "tessdata/${{ matrix.lang }}.traineddata"
          message: "chore(tessdata): fine-tune ${{ matrix.lang }} [skip ci]"
          default_author: github_actions
          push: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tessdata-${{ matrix.lang }}
          path: tessdata/${{ matrix.lang }}.traineddata
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -rf "$WORK_DIR"
