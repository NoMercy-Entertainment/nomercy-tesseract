name: Fine-tune Tesseract models

on:
  push:
    branches:
      - master
    paths:
      - "training/generated/**"
      - "training/ground-truth/**"
      - "training/config/**"
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated language codes (blank = all)"
        required: false
        default: ""
      max_iterations:
        description: "tesstrain MAX_ITERATIONS"
        required: false
        default: "400"

concurrency:
  group: tesseract-train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Resolve language matrix
    runs-on: [self-hosted, beast-unit]
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Build language matrix
        id: matrix
        shell: python3 {0}
        run: |
          import json, os
          from pathlib import Path

          override = "${{ github.event.inputs.languages }}".strip()

          if override:
              langs = [l.strip() for l in override.split(",") if l.strip()]
          else:
              # Derive from tessdata/ — every .traineddata gets trained
              skip = {"osd", "equ"}
              langs = sorted(
                  p.stem for p in Path("tessdata").glob("*.traineddata")
                  if p.stem not in skip
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"value={json.dumps({'lang': langs})}\n")
          print(f"Languages ({len(langs)}): {langs}")

  train:
    name: Train [${{ matrix.lang }}]
    needs: setup
    runs-on: [self-hosted, beast-unit]

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      LANG_CODE:      ${{ matrix.lang }}
      MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || '10000' }}
      WORK_DIR:       /tmp/tess-train/${{ matrix.lang }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make pkg-config \
            libleptonica-dev libicu-dev libpango1.0-dev libcairo2-dev \
            fonts-noto fonts-noto-cjk fonts-noto-cjk-extra \
            fonts-noto-extra fonts-noto-ui-core fonts-noto-core \
            fonts-dejavu fonts-liberation wget

      - name: Build patched Tesseract (--append_index fix)
        run: |
          if [ -x "$HOME/tesseract-install/bin/lstmtraining" ]; then
            echo "Patched Tesseract already built, skipping"
          else
            rm -rf $HOME/tesseract-src
            git clone --depth 1 --branch fix/append-index-lstmrecognizer \
              https://github.com/NoMercy-Entertainment/tesseract.git $HOME/tesseract-src
            cd $HOME/tesseract-src
            mkdir -p build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TRAINING_TOOLS=ON \
              -DCMAKE_INSTALL_PREFIX=$HOME/tesseract-install
            make -j$(nproc)
            sudo make install
            sudo ldconfig
            echo "Build complete"
          fi
          export PATH=$HOME/tesseract-install/bin:$PATH
          export LD_LIBRARY_PATH=$HOME/tesseract-install/lib:$LD_LIBRARY_PATH
          echo "PATH=$HOME/tesseract-install/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/tesseract-install/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "TESSDATA_PREFIX=/tmp/tesstrain/usr/share/tessdata" >> $GITHUB_ENV
          tesseract --version
          which lstmtraining

      - name: Clone tesstrain
        run: |
          rm -rf /tmp/tesstrain
          git clone --depth 1 https://github.com/tesseract-ocr/tesstrain.git /tmp/tesstrain

      - name: Generate ground-truth with text2image (parallel)
        run: |
          MODEL="$LANG_CODE"
          GT_DIR="/tmp/tesstrain/data/${MODEL}-ground-truth"
          mkdir -p "$GT_DIR"

          # Read font list
          FONTLIST=""
          if [ -f "training/generated/$MODEL/$MODEL.fonts" ]; then
            while IFS= read -r font; do
              [ -n "$font" ] && FONTLIST="${FONTLIST:+$FONTLIST,}$font"
            done < "training/generated/$MODEL/$MODEL.fonts"
          fi
          [ -z "$FONTLIST" ] && FONTLIST="Noto Sans,DejaVu Sans"

          TRAINING_TEXT="training/generated/$MODEL/$MODEL.training_text"
          if [ ! -f "$TRAINING_TEXT" ]; then
            echo "ERROR: No training text for $MODEL at $TRAINING_TEXT"
            exit 1
          fi

          TOTAL_LINES=$(wc -l < "$TRAINING_TEXT")
          NCPU=$(nproc)
          echo "Rendering $TOTAL_LINES lines with text2image ($NCPU cores)..."

          # Split training text into per-line temp files for parallel processing.
          # Each line becomes a tiny text file that text2image reads directly —
          # avoids all shell quoting issues with xargs.
          SPLIT_DIR="/tmp/text2image_split"
          mkdir -p "$SPLIT_DIR"
          awk -v dir="$SPLIT_DIR" -v model="$MODEL" '{
            num = sprintf("%06d", NR-1)
            file = dir "/" model "_" num ".txt"
            print > file
          }' "$TRAINING_TEXT"

          # Render all split files in parallel
          render_one() {
            local txtfile="$1"
            local stem
            stem=$(basename "${txtfile%.txt}")
            local outbase="$GT_DIR/$stem"
            local IFS=','
            for font in $FONTLIST; do
              if text2image \
                --text "$txtfile" \
                --outputbase "$outbase" \
                --font "$font" \
                --fonts_dir /usr/share/fonts \
                --ptsize 32 \
                --xsize 3600 \
                --ysize 480 \
                --margin 10 \
                --leading 32 2>/dev/null; then
                cp "$txtfile" "${outbase}.gt.txt"
                return 0
              fi
            done
            return 1
          }
          export -f render_one
          export GT_DIR FONTLIST

          find "$SPLIT_DIR" -name "${MODEL}_*.txt" -print0 | \
            xargs -0 -P "$NCPU" -n 1 bash -c 'render_one "$1"' _

          rm -rf "$SPLIT_DIR"

          # Count results and report
          COUNT=$(ls "$GT_DIR"/*.gt.txt 2>/dev/null | wc -l)
          echo "Generated $COUNT ground-truth pairs for $MODEL"
          [ "$COUNT" -gt 0 ] || { echo "ERROR: no images generated for $MODEL"; exit 1; }

          # Also copy hand-verified ground-truth images
          for png in training/ground-truth/${MODEL}_*.png; do
            [ -f "$png" ] || continue
            stem=$(basename "${png%.png}")
            cp "$png" "$GT_DIR/${stem}.png"
            gt="${png%.png}.gt.txt"
            [ -f "$gt" ] && cp "$gt" "$GT_DIR/${stem}.gt.txt"
          done

          echo "MODEL=$MODEL" >> $GITHUB_ENV
          echo "GT_DIR=$GT_DIR" >> $GITHUB_ENV

      - name: Download tessdata_best model for fine-tuning
        run: |
          # Our repo has fast/int models which CANNOT be fine-tuned.
          # tessdata_best has float models required for LSTM training.
          mkdir -p /tmp/tesstrain/usr/share/tessdata
          # Copy tessdata configs (lstm.train etc.) to TESSDATA_PREFIX
          cp -r $HOME/tesseract-install/share/tessdata/configs /tmp/tesstrain/usr/share/tessdata/ 2>/dev/null || true
          cp -r $HOME/tesseract-install/share/tessdata/tessconfigs /tmp/tesstrain/usr/share/tessdata/ 2>/dev/null || true
          BEST_URL="https://github.com/tesseract-ocr/tessdata_best/raw/main/${MODEL}.traineddata"
          echo "Downloading tessdata_best for $MODEL..."
          wget -q -O "/tmp/tesstrain/usr/share/tessdata/${MODEL}.traineddata" "$BEST_URL" || {
            echo "ERROR: Failed to download tessdata_best for $MODEL from $BEST_URL"
            echo "This language may not exist in tessdata_best — skipping"
            exit 1
          }
          echo "Downloaded $(wc -c < /tmp/tesstrain/usr/share/tessdata/${MODEL}.traineddata) bytes"

      - name: Validate ground-truth pairs
        run: |
          # Generate box files and remove any pair where box generation fails.
          # This ensures tesstrain's make won't hit broken entries.
          GT_COUNT=$(ls "$GT_DIR"/*.gt.txt 2>/dev/null | wc -l)
          NCPU=$(nproc)
          echo "Validating $GT_COUNT ground-truth pairs ($NCPU parallel workers)..."

          cd /tmp/tesstrain

          # Parallel box generation + validation
          ls "$GT_DIR"/*.gt.txt 2>/dev/null | xargs -P "$NCPU" -I {} bash -c '
            gt="{}"
            STEM="${gt%.gt.txt}"
            # Check tif exists and has reasonable size
            if [ ! -f "${STEM}.tif" ] || [ "$(wc -c < "${STEM}.tif")" -lt 200 ]; then
              rm -f "${STEM}".tif "${STEM}".gt.txt
              exit 0
            fi
            # Generate box file
            python3 generate_line_box.py -i "${STEM}.tif" -t "${STEM}.gt.txt" > "${STEM}.box" 2>/dev/null
            if [ ! -s "${STEM}.box" ]; then
              rm -f "${STEM}".tif "${STEM}".gt.txt "${STEM}".box
            fi
          '

          cd -
          VALID=$(ls "$GT_DIR"/*.gt.txt 2>/dev/null | wc -l)
          REMOVED=$((GT_COUNT - VALID))
          echo "Valid: $VALID, Removed: $REMOVED"
          [ "$VALID" -gt 0 ] || { echo "ERROR: no valid ground-truth for $MODEL"; exit 1; }

      - name: Prepare langdata and output dir for tesstrain
        run: |
          OUTPUT_DIR="/tmp/tesstrain/data/$MODEL"
          LANGDATA_DIR="/tmp/tesstrain/data/langdata"
          mkdir -p "$OUTPUT_DIR" "$LANGDATA_DIR/$MODEL"

          # Download radical-stroke.txt (required by combine_lang_model)
          wget -q -O "$LANGDATA_DIR/radical-stroke.txt" \
            "https://github.com/tesseract-ocr/langdata_lstm/raw/main/radical-stroke.txt" || true

          # Download script unicharsets that tesstrain needs
          echo "Downloading script unicharsets..."
          SCRIPTS="Latin Cyrillic Greek Arabic Hebrew Devanagari Bengali Tamil Telugu
                   Kannada Malayalam Gujarati Gurmukhi Thai Khmer Lao Myanmar Sinhala
                   Ethiopic Georgian Armenian Han Hiragana Katakana Hangul Bopomofo
                   Canadian_Aboriginal Cherokee Ogham Oriya Runic Syriac"
          DL_COUNT=0
          for script in $SCRIPTS; do
            wget -q -O "$LANGDATA_DIR/${script}.unicharset" \
              "https://github.com/tesseract-ocr/langdata_lstm/raw/main/${script}.unicharset" 2>/dev/null && DL_COUNT=$((DL_COUNT + 1)) || true
          done
          echo "Downloaded $DL_COUNT script unicharsets"

          # Create wordlist/punc/numbers in OUTPUT_DIR (where Makefile expects them)
          touch "$OUTPUT_DIR/$MODEL.wordlist"
          touch "$OUTPUT_DIR/$MODEL.punc"
          touch "$OUTPUT_DIR/$MODEL.numbers"

          # Download language config to langdata dir
          wget -q -O "$LANGDATA_DIR/$MODEL/$MODEL.config" \
            "https://github.com/tesseract-ocr/langdata_lstm/raw/main/$MODEL/$MODEL.config" 2>/dev/null || true

          echo "Langdata and output dir prepared"

      - name: "Phase 1: Build proto model + lstmf files"
        run: |
          GT_FILES=$(ls /tmp/tesstrain/data/${MODEL}-ground-truth/*.gt.txt 2>/dev/null | wc -l)
          echo "Starting: $GT_FILES ground-truth files, $MAX_ITERATIONS iterations"
          echo "  Using --append_index to replace output layer (adds ♪ to existing model)"
          echo ""

          export TESSDATA_PREFIX=/tmp/tesstrain/usr/share/tessdata
          export LD_LIBRARY_PATH=$HOME/tesseract-install/lib:${LD_LIBRARY_PATH:-}
          export PATH=$HOME/tesseract-install/bin:$PATH
          echo "Using tesseract: $(which tesseract)"
          MAKE_ARGS="MODEL_NAME=$MODEL START_MODEL=$MODEL TESSDATA=/tmp/tesstrain/usr/share/tessdata LANGDATA_DIR=/tmp/tesstrain/data/langdata PSM=13"

          echo "Building proto model with extended unicharset..."
          make -k -C /tmp/tesstrain proto-model $MAKE_ARGS || true

          echo "Generating lstmf files ($(nproc) parallel)..."
          make -k -j"$(nproc)" -C /tmp/tesstrain \
            $(find /tmp/tesstrain/data/${MODEL}-ground-truth -name "*.gt.txt" \
              | sed 's/\.gt\.txt$/.lstmf/') \
            $MAKE_ARGS || true

          # Build train/eval lists from successful lstmf files
          OUTPUT_DIR="/tmp/tesstrain/data/$MODEL"
          find /tmp/tesstrain/data/${MODEL}-ground-truth -name "*.lstmf" > "$OUTPUT_DIR/all-lstmf"
          TOTAL_LSTMF=$(wc -l < "$OUTPUT_DIR/all-lstmf")
          echo "Generated $TOTAL_LSTMF lstmf files"

          cd /tmp/tesstrain
          python3 shuffle.py 0 "$OUTPUT_DIR/all-lstmf"
          TRAIN_SIZE=$(( TOTAL_LSTMF * 90 / 100 ))
          head -n "$TRAIN_SIZE" "$OUTPUT_DIR/all-lstmf" > "$OUTPUT_DIR/list.train"
          tail -n +"$((TRAIN_SIZE + 1))" "$OUTPUT_DIR/all-lstmf" > "$OUTPUT_DIR/list.eval"
          cd -

          TRAIN_COUNT=$(wc -l < "$OUTPUT_DIR/list.train")
          EVAL_COUNT=$(wc -l < "$OUTPUT_DIR/list.eval")
          echo "Training: $TRAIN_COUNT, Eval: $EVAL_COUNT"
          [ "$TRAIN_COUNT" -gt 0 ] || { echo "ERROR: no training files"; exit 1; }

      - name: "Phase 2: LSTM training with --append_index"
        run: |
          OUTPUT_DIR="/tmp/tesstrain/data/$MODEL"
          TESSDATA_DIR="/tmp/tesstrain/usr/share/tessdata"

          # Read unicharset size from proto model
          combine_tessdata -u "$OUTPUT_DIR/$MODEL.traineddata" "$OUTPUT_DIR/proto_"
          NCHARS=$(head -1 "$OUTPUT_DIR/proto_lstm-unicharset")
          echo "Proto model unicharset: $NCHARS characters"

          mkdir -p "$OUTPUT_DIR/checkpoints"

          echo "Training with --append_index 5 (replacing output layer)..."
          echo "  Base model: tessdata_best/$MODEL (all LSTM knowledge preserved)"
          echo "  New output: $NCHARS chars (includes ♪ ♫ ♩ ♬ and all extended chars)"
          echo "  BCER progress every 100 iterations..."
          echo ""

          lstmtraining \
            --traineddata "$OUTPUT_DIR/$MODEL.traineddata" \
            --old_traineddata "$TESSDATA_DIR/$MODEL.traineddata" \
            --continue_from "$OUTPUT_DIR/$MODEL.lstm" \
            --append_index 5 \
            --net_spec "O1c$NCHARS" \
            --net_mode 192 \
            --learning_rate 0.001 \
            --model_output "$OUTPUT_DIR/checkpoints/$MODEL" \
            --train_listfile "$OUTPUT_DIR/list.train" \
            --eval_listfile "$OUTPUT_DIR/list.eval" \
            --max_iterations "$MAX_ITERATIONS" \
            --target_error_rate 0.01

      - name: "Phase 3: Package traineddata"
        run: |
          OUTPUT_DIR="/tmp/tesstrain/data/$MODEL"
          CHECKPOINT=$(ls -t "$OUTPUT_DIR"/checkpoints/${MODEL}*checkpoint 2>/dev/null | head -1)
          [ -n "$CHECKPOINT" ] || { echo "ERROR: no checkpoint found"; exit 1; }
          echo "Using checkpoint: $CHECKPOINT"

          lstmtraining \
            --stop_training \
            --continue_from "$CHECKPOINT" \
            --traineddata "$OUTPUT_DIR/$MODEL.traineddata" \
            --model_output "tessdata/$LANG_CODE.traineddata"

          SIZE=$(wc -c < "tessdata/$LANG_CODE.traineddata")
          echo "Output: tessdata/$LANG_CODE.traineddata ($SIZE bytes)"

      - name: Validate model
        continue-on-error: true
        run: |
          mkdir -p "$WORK_DIR"
          python3 training/scripts/validate-model.py \
            --tessdata tessdata/ \
            --lang "$LANG_CODE" \
            --gt-dir training/ground-truth \
            --report "$WORK_DIR/report.json"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.lang }}
          path: ${{ env.WORK_DIR }}/report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated tessdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "tessdata/$LANG_CODE.traineddata"
          git diff --cached --quiet && exit 0

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master || true
            git diff --cached --quiet || git commit -m "chore(tessdata): fine-tune $LANG_CODE [skip ci]"
            if git push origin master; then
              echo "Pushed $LANG_CODE (attempt $attempt)"
              break
            fi
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 2))
          done

      - name: Upload tessdata artifact
        uses: actions/upload-artifact@v4
        with:
          name: tessdata-${{ matrix.lang }}
          path: tessdata/${{ matrix.lang }}.traineddata
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/tesstrain /tmp/tess-train

  report:
    name: Training report
    needs: [setup, train]
    if: always()
    runs-on: [self-hosted, beast-unit]

    steps:
      - uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports/
          merge-multiple: false

      - name: Generate summary
        shell: python3 {0}
        run: |
          import json, os, glob

          reports = []
          for f in sorted(glob.glob("reports/report-*/report.json")):
              try:
                  reports.append(json.load(open(f)))
              except Exception:
                  continue

          summary = "## Tesseract Training Report\n\n"
          summary += "| Language | Status | Passed | Total | Accuracy | Failures |\n"
          summary += "|----------|--------|--------|-------|----------|----------|\n"

          total_passed = 0
          total_total = 0
          failed_langs = []

          for r in reports:
              lang = r.get("lang", "?")
              passed = r.get("passed", 0)
              total = r.get("total", 0)
              status = r.get("status", "unknown")
              failures = r.get("failures", [])
              pct = f"{(passed/total*100):.0f}%" if total > 0 else "-"
              fail_summary = f"{len(failures)} failures" if failures else "-"

              icon = "OK" if status == "passed" else "FAIL" if status == "failed" else "WARN"
              summary += f"| {lang} | {icon} {status} | {passed} | {total} | {pct} | {fail_summary} |\n"

              total_passed += passed
              total_total += total
              if status == "failed":
                  failed_langs.append(lang)

          summary += f"\n**Overall: {total_passed}/{total_total} passed**\n"

          if failed_langs:
              summary += f"\n**Failed languages: {', '.join(failed_langs)}**\n"
              summary += "\n### Failure Details\n\n"
              for r in reports:
                  if r.get("status") != "failed":
                      continue
                  for f in r.get("failures", []):
                      summary += f"- **{r['lang']}**: expected `{f.get('expected')}` got `{f.get('actual')}` ({f.get('accuracy', '?')})\n"

          if not reports:
              summary += "\nNo reports collected — all training jobs may have failed before validation.\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(summary)

          result = {
              "total_passed": total_passed,
              "total_total": total_total,
              "failed_languages": failed_langs,
              "reports": reports,
          }
          with open("training-report.json", "w") as fh:
              json.dump(result, fh, indent=2)

          print(summary)

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: training-report.json
          retention-days: 90
